services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    restart: always

volumes:
  rabbitmq_data:
